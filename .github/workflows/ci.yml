name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tesajor
          POSTGRES_PASSWORD: tesajor
          POSTGRES_DB: tesajor
        # Host port 5433 matches the local docker-compose mapping that
        # .env.example documents, so DATABASE_URL is identical in both.
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U tesajor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://tesajor:tesajor@localhost:5433/tesajor
      # Throwaway secret for the ephemeral CI database only.
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else
      AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run migrations
        run: pnpm db:migrate

      # Specs register their own users and stub/seed their own data
      # (see e2e/*.spec.ts) — no seed script needed. The Playwright config
      # starts the dev server itself.
      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
